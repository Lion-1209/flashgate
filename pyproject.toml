[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flashgate"
version = "0.5.1"
description = "Hardware-in-the-loop verification gate: your agent can't claim the firmware works until the board says so."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pyserial>=3.5",
    "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/Lion-1209/flashgate"
Repository = "https://github.com/Lion-1209/flashgate"
Issues = "https://github.com/Lion-1209/flashgate/issues"

[project.optional-dependencies]
mcp = ["mcp>=1.2,<3"]
dev = ["pytest>=8"]

[project.scripts]
flashgate = "flashgate.cli:main"
flashgate-mcp = "flashgate.mcp_server:main"

[tool.pytest.ini_options]
# keep pytest from climbing into parent workspaces for config
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["flashgate*"]
