[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flashgate"
version = "0.1.0"
description = "Hardware-in-the-loop verification gate: your agent can't claim the firmware works until the board says so."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pyserial>=3.5",
    "PyYAML>=6.0",
]

[project.scripts]
flashgate = "flashgate.cli:main"

[tool.setuptools.packages.find]
include = ["flashgate*"]
