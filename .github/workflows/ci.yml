name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    env:
      # windows+3.11 leg exercises the ANSI-code-page path: non-ASCII
      # repo paths must not crash git-output decoding (fail-open bug class)
      PYTHONUTF8: ${{ (matrix.os == 'windows-latest' && matrix.python == '3.11') && '0' || '1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev,mcp]"   # mcp extra: the MCP contract tests are hardware-free and must run in CI
      - run: pytest -q
