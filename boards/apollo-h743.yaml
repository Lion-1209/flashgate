# Board profile: ALIENTEK Apollo STM32H743IIT6 (core board)
# Console side is just USART1 TTL (PA9/PA10) on the core-board header — the
# USB side is whatever USB-TTL adapter bridges it to the PC (CH340, CP210x,
# FT232...). Port resolution: explicit `port` / env FLASHGATE_SERIAL_PORT >
# VID/PID hint > sole serial port. The banner regex is the final identity
# proof regardless of which adapter answered.
board: apollo-h743
mcu: STM32H743IIT6
description: ALIENTEK Apollo core board, console on USART1 header via external USB-TTL adapter

firmware:
  dir: ../../apollo                   # relative to this yaml file
  configure: cmake --preset Debug    # run once when build/ is missing
  build: ninja -C build/Debug
  artifact: build/Debug/Apollo.bin

flash:
  connect: port=SWD                  # ST-Link
  address: "0x08000000"

serial:
  port: ""                            # explicit override (e.g. COM3); empty = auto
  vid: 0x1A86                        # detection HINT: CH340/CH341 adapters
  pids: [0x7523, 0x5523]
  baudrate: 115200
  banner_regex: 'FLASHGATE-BOOT board=(?P<board>\S+) git=(?P<git>\S+) build=(?P<build>\S+) rtos=(?P<rtos>\S+)'
  banner_timeout_s: 15
  error_patterns: ["HardFault", "Assertion", "assert_param"]

# Exit-code contract (what the M3 Stop hook will consume):
#   0 = verified  1 = build failed  2 = flash failed  3 = no banner (timeout)
#   4 = boot error string seen      5 = git sha mismatch  6 = env/prereq error
